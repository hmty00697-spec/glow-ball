name: Build Glow Ball APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Glow Ball
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Download python-for-android
        uses: actions/checkout@v7
        with:
          repository: kivy/python-for-android
          path: p4a

      - name: Install python-for-android
        run: |
          python -m pip install --upgrade pip
          cd p4a
          python -m pip install -e .

      - name: Install Android prerequisites
        run: |
          python p4a/pythonforandroid/prerequisites.py

      - name: Check game files
        run: |
          echo "Files in project:"
          ls -la
          echo "Checking main.py..."
          test -f main.py

      - name: Build Glow Ball APK
        run: |
          python p4a/pythonforandroid/toolchain.py apk \
            --bootstrap=sdl2 \
            --requirements=python3,pygame-ce \
            --private=. \
            --package=org.glowball.game \
            --name="Glow Ball" \
            --version=1.0 \
            --arch=arm64-v8a \
            --debug

      - name: Find APK
        run: |
          echo "Searching for APK..."
          find . -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Glow-Ball-APK
          path: "**/*.apk"
          if-no-files-found: error
