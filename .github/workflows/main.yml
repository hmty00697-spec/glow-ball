name: Build Glow Ball APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download python-for-android
        uses: actions/checkout@v4
        with:
          repository: kivy/python-for-android
          path: p4a

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          cd p4a
          python -m pip install .

      - name: Install Android build tools
        run: |
          python p4a/pythonforandroid/prerequisites.py

      - name: Build APK
        run: |
          python p4a/pythonforandroid/entrypoints.py apk \
            --private /home/runner/work/glow-ball/glow-ball \
            --package org.glowball.game \
            --name "Glow Ball" \
            --version 1.0 \
            --bootstrap sdl2 \
            --requirements=python3,pygame \
            --arch=arm64-v8a \
            --debug \
            --private /home/runner/work/glow-ball/glow-ball

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Glow-Ball-APK
          path: "**/*.apk"
